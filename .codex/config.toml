# Codex project settings for the Codex for PMs course folder.
# Codex reads this file only after the student says yes to trusting the folder.
#
# The two Rook connectors (MCP servers). Both are read-only: they answer
# questions about the fictional company and can't change anything.
# default_tools_approval_mode = "approve" lets Codex use them without asking
# the student each time. rook-wiki answers from a database copy of the wiki,
# so calls finish well inside Codex's 300-second default tool timeout.

[mcp_servers.rook-database]
url = "https://mxbeajhhzutrfzqpsxnn.supabase.co/functions/v1/rook-database"
default_tools_approval_mode = "approve"

[mcp_servers.rook-wiki]
url = "https://mxbeajhhzutrfzqpsxnn.supabase.co/functions/v1/rook-wiki"
default_tools_approval_mode = "approve"
